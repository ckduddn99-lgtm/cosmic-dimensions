name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      # 앱을 업데이트해도 WebView가 예전 JS/CSS를 쓰지 않도록 빌드마다 주소를 바꾸고, 설정 화면에 빌드 번호를 표시한다
      - name: Stamp build
        run: |
          TAG="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          sed -i -e "s/?v=dev/?v=${TAG}/g" -e "s#<span id=\"build-tag\">dev</span>#<span id=\"build-tag\">${TAG}</span>#" www/index.html
          grep -c "?v=${TAG}" www/index.html

      - name: Add Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Setup signing
        run: |
          cp debug.keystore android/app/debug.keystore
          printf '%s\n' 'android {' '    signingConfigs {' '        release {' "            storeFile file('debug.keystore')" "            storePassword 'android'" "            keyAlias 'androiddebugkey'" "            keyPassword 'android'" '        }' '    }' '    buildTypes {' '        release {' '            signingConfig signingConfigs.release' '        }' '    }' '}' >> android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-dimensions-apk
          path: android/app/build/outputs/apk/release/app-release.apk
