name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Setup signing
        run: |
          cp debug.keystore android/app/debug.keystore
          printf '%s\n' 'android {' '    signingConfigs {' '        release {' "            storeFile file('debug.keystore')" "            storePassword 'android'" "            keyAlias 'androiddebugkey'" "            keyPassword 'android'" '        }' '    }' '    buildTypes {' '        release {' '            signingConfig signingConfigs.release' '        }' '    }' '}' >> android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-dimensions-apk
          path: android/app/build/outputs/apk/release/app-release.apk
